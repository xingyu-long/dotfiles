"$schema" = 'https://starship.rs/config-schema.json'

# Keep the prompt snappy: give slow modules up to 500ms, then skip them
scan_timeout = 30
command_timeout = 500

# Layout:  host ~/path branch [status]  v3.12(venv) 5s ✦1            14:13
#          ❯
# Language versions only appear inside a matching project; the time sits on
# the right edge.
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$jobs\
$line_break\
$character\
"""
right_format = '$time'

# User: only shown over SSH or as root (then rendered as user@host)
[username]
style_user = 'bold cyan'
style_root = 'bold red'
format = '[$user]($style)[@](dimmed white)'

# Hostname
[hostname]
ssh_only = false
style = 'green'
format = '[$hostname]($style) '

# Directory: always the full path
[directory]
style = 'bold yellow'
home_symbol = '~'
truncation_length = 0
truncate_to_repo = false
read_only = ' 🔒'
format = '[$path]($style)[$read_only]($read_only_style) '

# Git branch
[git_branch]
symbol = ''
style = 'bold cyan'
truncation_length = 32
truncation_symbol = '…'
format = '[$symbol$branch]($style)'

# Git status:  $ stash  !N modified  +N staged  ?N untracked  ⇡⇣ ahead/behind
[git_status]
style = 'bold red'
format = '( [\[$all_status$ahead_behind\]]($style)) '
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '\$'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

# Python: only shown when a virtualenv is active (built-in, no subprocess per prompt)
[python]
detect_extensions = []
detect_files = []
detect_folders = []
pyenv_version_name = false
style = 'yellow'
symbol = ' '
format = '[$symbol${version}\(${virtualenv}\)]($style) '

# Other languages: shown only in a matching project
[nodejs]
symbol = ' '
format = '[$symbol$version](green) '

[rust]
symbol = '󱘗 '
format = '[$symbol$version](red) '

[golang]
symbol = ' '
format = '[$symbol$version](cyan) '

# Slow commands
[cmd_duration]
min_time = 3_000
style = 'yellow'
format = '[$duration]($style) '

# Background jobs
[jobs]
symbol = '✦'
style = 'bold blue'
number_threshold = 1
format = '[$symbol$number]($style) '

# Time (right side)
[time]
disabled = false
style = 'dimmed white'
time_format = '%H:%M'
format = '[$time]($style)'

# Character: green when the last command succeeded, red when it failed
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
